  <body>
    <div id="root"></div>

    <!-- Netlify Forms ---------------------------------------------------
         Netlify only registers a form when it finds it in the deployed HTML,
         and the contact form below is rendered by JavaScript. This hidden
         duplicate gives Netlify the field list at deploy time.
         Its field names MUST stay identical to the visible form.
         It is never displayed to visitors. -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
